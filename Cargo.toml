[package]
name = "nft-dashboard"
version = "0.1.0"
edition = "2021"
description = "AEGIS keyboard-first network control TUI for nftables, NetworkManager, and sockets"

[dependencies]
anyhow = "1.0"
crossterm = "0.27"
ratatui = "0.26"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
